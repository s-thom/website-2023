name: Astro
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".node-version"
          cache: "npm"

      - name: Install
        run: |
          npm ci

      # This is needed for to generate the types, now that we're using the typesafe ESLint configs
      - name: Astro sync
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          npm run astro-check

      - name: ESLint
        run: |
          npm run lint

      - name: Astro check
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          npm run astro-check

      - name: Typescript
        run: |
          npm run typecheck

      - name: Build
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          npm run build
